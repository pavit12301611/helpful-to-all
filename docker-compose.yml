services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openhub}
      POSTGRES_DB: openhub
    volumes:
      - openhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openhub -d openhub']
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment to reach the database from your host:
    # ports:
    #   - '5432:5432'

  # Optional: shared rate limiting across app replicas.
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  app:
    build:
      context: .
      args:
        AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://openhub:${POSTGRES_PASSWORD:-openhub}@db:5432/openhub?schema=public
      OPENHUB_DB: postgresql
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-OpenHub <no-reply@openhub.local>}
      SMTP_URL: ${SMTP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIR: /app/storage/uploads
      MAP_PROVIDER: ${MAP_PROVIDER:-openstreetmap}
      REDIS_URL: ${REDIS_URL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-OpenHub!2345}
    volumes:
      - openhub-uploads:/app/storage/uploads
    ports:
      - '${PORT:-3000}:3000'

volumes:
  openhub-pgdata:
  openhub-uploads:
